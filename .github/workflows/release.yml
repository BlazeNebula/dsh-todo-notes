name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建客户端
        run: node scripts/build-client.mjs
      - name: 打包并校验
        run: |
          npm pack
          TGZ="$(ls dsh-todo-notes-*.tgz | head -n1)"
          sha256sum "$TGZ" > "$TGZ.sha256"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.TGZ }}
            ${{ env.TGZ }}.sha256
            scripts/install.ps1
            scripts/install.sh
